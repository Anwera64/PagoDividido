[versions]
agp                     = "9.1.0"
kotlin-compose-plugin   = "2.2.10"
ksp                     = "2.3.6"
core-ktx                = "1.13.1"
appcompat               = "1.7.0"
activity                = "1.9.2"
fragment                = "1.8.4"
constraintlayout        = "2.1.4"
lifecycle               = "2.8.6"
arch-core               = "2.2.0"
navigation              = "2.8.3"
compose-bom             = "2024.09.00"
material                = "1.12.0"
room                    = "2.7.2"
hilt                    = "2.59.2"
coroutines              = "1.8.1"
junit                   = "4.13.2"
androidx-test-junit     = "1.2.1"
espresso                = "3.6.1"
mockito-core            = "5.12.0"
mockito-kotlin          = "5.4.0"
javax-inject            = "1"

[libraries]
androidx-core-ktx                       = { module = "androidx.core:core-ktx",                             version.ref = "core-ktx" }
androidx-appcompat                      = { module = "androidx.appcompat:appcompat",                       version.ref = "appcompat" }
androidx-activity-ktx                   = { module = "androidx.activity:activity-ktx",                    version.ref = "activity" }
androidx-activity-compose               = { module = "androidx.activity:activity-compose",                 version.ref = "activity" }
androidx-fragment-ktx                   = { module = "androidx.fragment:fragment-ktx",                    version.ref = "fragment" }
androidx-constraintlayout               = { module = "androidx.constraintlayout:constraintlayout",         version.ref = "constraintlayout" }
androidx-legacy-support                 = { module = "androidx.legacy:legacy-support-v4",                 version = "1.0.0" }
androidx-cardview                       = { module = "androidx.cardview:cardview",                         version = "1.0.0" }
androidx-recyclerview                   = { module = "androidx.recyclerview:recyclerview",                 version = "1.2.1" }
androidx-lifecycle-viewmodel-ktx        = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx",        version.ref = "lifecycle" }
androidx-lifecycle-livedata-ktx         = { module = "androidx.lifecycle:lifecycle-livedata-ktx",         version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-savedstate = { module = "androidx.lifecycle:lifecycle-viewmodel-savedstate", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose    = { module = "androidx.lifecycle:lifecycle-viewmodel-compose",    version.ref = "lifecycle" }
androidx-navigation-runtime-ktx         = { module = "androidx.navigation:navigation-runtime-ktx",        version.ref = "navigation" }
androidx-navigation-fragment-ktx        = { module = "androidx.navigation:navigation-fragment-ktx",       version.ref = "navigation" }
androidx-navigation-ui-ktx              = { module = "androidx.navigation:navigation-ui-ktx",             version.ref = "navigation" }
androidx-navigation-testing             = { module = "androidx.navigation:navigation-testing",             version.ref = "navigation" }
compose-bom                             = { module = "androidx.compose:compose-bom",                      version.ref = "compose-bom" }
compose-material3                       = { module = "androidx.compose.material3:material3" }
compose-ui-tooling-preview              = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling                      = { module = "androidx.compose.ui:ui-tooling" }
compose-runtime-livedata                = { module = "androidx.compose.runtime:runtime-livedata" }
material                                = { module = "com.google.android.material:material",               version.ref = "material" }
androidx-room-runtime                   = { module = "androidx.room:room-runtime",                        version.ref = "room" }
androidx-room-compiler                  = { module = "androidx.room:room-compiler",                       version.ref = "room" }
androidx-room-ktx                       = { module = "androidx.room:room-ktx",                            version.ref = "room" }
androidx-room-testing                   = { module = "androidx.room:room-testing",                        version.ref = "room" }
dagger                                  = { module = "com.google.dagger:dagger",                         version.ref = "hilt" }
hilt-android                            = { module = "com.google.dagger:hilt-android",                    version.ref = "hilt" }
hilt-compiler                           = { module = "com.google.dagger:hilt-compiler",                   version.ref = "hilt" }
kotlinx-coroutines-core                 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core",     version.ref = "coroutines" }
kotlinx-coroutines-android              = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android",  version.ref = "coroutines" }
kotlinx-coroutines-test                 = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test",     version.ref = "coroutines" }
junit                                   = { module = "junit:junit",                                        version.ref = "junit" }
androidx-test-junit                     = { module = "androidx.test.ext:junit",                           version.ref = "androidx-test-junit" }
androidx-test-espresso-core             = { module = "androidx.test.espresso:espresso-core",              version.ref = "espresso" }
androidx-arch-core-testing              = { module = "androidx.arch.core:core-testing",                   version.ref = "arch-core" }
mockito-core                            = { module = "org.mockito:mockito-core",                           version.ref = "mockito-core" }
mockito-kotlin                          = { module = "org.mockito.kotlin:mockito-kotlin",                  version.ref = "mockito-kotlin" }
javax-inject                            = { module = "javax.inject:javax.inject",                          version.ref = "javax-inject" }

[bundles]
room        = ["androidx-room-runtime", "androidx-room-ktx"]
coroutines  = ["kotlinx-coroutines-core", "kotlinx-coroutines-android"]
navigation  = ["androidx-navigation-runtime-ktx", "androidx-navigation-fragment-ktx", "androidx-navigation-ui-ktx"]
lifecycle   = ["androidx-lifecycle-viewmodel-ktx", "androidx-lifecycle-livedata-ktx", "androidx-lifecycle-viewmodel-savedstate"]
android-test = ["androidx-test-junit", "androidx-test-espresso-core"]

[plugins]
android-application = { id = "com.android.application",                 version.ref = "agp" }
android-library     = { id = "com.android.library",                     version.ref = "agp" }
hilt                = { id = "com.google.dagger.hilt.android",          version.ref = "hilt" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose",     version.ref = "kotlin-compose-plugin" }
ksp                 = { id = "com.google.devtools.ksp",                 version.ref = "ksp" }
