name: Android CI

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master, develop ]

# Required for dorny/test-reporter to annotate PRs and Checks,
# and for the cleanup job to delete GitHub Actions caches.
permissions:
  checks: write
  pull-requests: write
  actions: write

jobs:

  # ── Compile: warm the Gradle build cache ─────────────────────────────────
  # Runs first so that all downstream jobs restore compiled outputs from cache
  # instead of recompiling the whole project tree independently.
  compile:
    name: Compile (warm build cache)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (write cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false   # this job is the sole cache writer

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile all modules (debug)
        run: ./gradlew assembleDebug --build-cache

  # ── Lint ─────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: compile    # restores warm cache → compilation is UP-TO-DATE
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (read-only cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Lint (all modules)
        run: ./gradlew lintDebug --build-cache

      - name: Upload Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: '**/build/reports/lint-results-*.html'
          if-no-files-found: warn

  # ── Unit Tests (parallel per module) ─────────────────────────────────────
  unit-tests:
    name: "Tests · :${{ matrix.module }}"
    runs-on: ubuntu-latest
    needs: compile    # restores warm cache → no redundant recompilation
    strategy:
      fail-fast: false          # keep other modules running even if one fails
      matrix:
        module: [ domain, data, presentation, app ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (read-only cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests · :${{ matrix.module }}
        run: ./gradlew :${{ matrix.module }}:test --build-cache

      # Publishes results as a GitHub Check with pass/fail annotations on the PR
      - name: Publish Test Results · :${{ matrix.module }}
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "Unit Tests · :${{ matrix.module }}"
          path: "${{ matrix.module }}/build/test-results/**/*.xml"
          reporter: java-junit
          fail-on-error: true

      # Keep the HTML reports as downloadable artifacts
      - name: Upload Test Reports · :${{ matrix.module }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.module }}
          path: "${{ matrix.module }}/build/reports/tests/"
          if-no-files-found: warn

  # ── Build APK (only after lint + all tests pass) ──────────────────────────
  # assembleDebug is UP-TO-DATE from the compile cache → nearly instant
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    needs: [ lint, unit-tests ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle (read-only cache)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --build-cache

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk

  # ── Cleanup: delete this branch's Gradle caches ───────────────────────────
  # Runs after everything (even on failure/skip) to ensure the next pipeline
  # run on this branch always starts from a clean cache state.
  cleanup:
    name: Cleanup Gradle Caches
    runs-on: ubuntu-latest
    needs: build
    if: always()   # runs regardless of whether upstream jobs passed, failed, or were skipped

    steps:
      - name: Delete Gradle caches for this branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching Gradle caches for ref: ${{ github.ref }}"

          caches=$(gh api \
            "/repos/${{ github.repository }}/actions/caches?ref=${{ github.ref }}&per_page=100" \
            --jq '.actions_caches[] | select(.key | startswith("gradle")) | .id')

          if [ -z "$caches" ]; then
            echo "No Gradle caches found — nothing to clean up."
            exit 0
          fi

          for id in $caches; do
            echo "Deleting cache id: $id"
            gh api --method DELETE \
              "/repos/${{ github.repository }}/actions/caches/$id"
          done

          echo "Cache cleanup complete."

